name: Set up Lua 5.2
description: Install the checksum-pinned Ubuntu 24.04 x64 Lua interpreter and compiler.
runs:
  using: composite
  steps:
    - name: Restore the Lua package
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ${{ runner.temp }}/lua5.2_5.2.4-3build2_amd64.deb
        key: lua-deb-de75fdb69ad75802cff02ac7c081d7953082fc34fed4091d7fffc7498a55564c
    - name: Verify and unpack Lua
      shell: bash
      env:
        LUA_DEB: lua5.2_5.2.4-3build2_amd64.deb
      run: |
        package="$RUNNER_TEMP/$LUA_DEB"
        checksum="de75fdb69ad75802cff02ac7c081d7953082fc34fed4091d7fffc7498a55564c  $package"
        if ! sha256sum --check --status <<< "$checksum" 2>/dev/null; then
          curl --fail --silent --show-error --location --max-time 8 \
            "https://security.ubuntu.com/ubuntu/pool/universe/l/lua5.2/$LUA_DEB" \
            -o "$package"
          sha256sum --check <<< "$checksum"
        fi
        dpkg-deb --extract "$package" "$RUNNER_TEMP/lua"
        # The Lua tests skip themselves without Lua, so fail here if it can't run.
        "$RUNNER_TEMP/lua/usr/bin/lua5.2" -v
        "$RUNNER_TEMP/lua/usr/bin/luac5.2" -v
        echo "$RUNNER_TEMP/lua/usr/bin" >> "$GITHUB_PATH"
    - name: Seed the Lua package cache on the default branch
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: >-
        steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      with:
        path: ${{ runner.temp }}/lua5.2_5.2.4-3build2_amd64.deb
        key: ${{ steps.cache.outputs.cache-primary-key }}
