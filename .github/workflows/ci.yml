name: CI

# Do not use event-level path filters: GitHub truncates their changed-file list.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per commit: a re-run or late run for an older commit can never
  # cancel the newest commit's checks. Pushes never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      freighter: ${{ steps.paths.outputs.freighter }}
      freighter_art: ${{ steps.paths.outputs.freighter_art }}
      depots: ${{ steps.paths.outputs.depots }}
      depots_art: ${{ steps.paths.outputs.depots_art }}
      mod: ${{ steps.paths.outputs.mod }}
      repository: ${{ steps.paths.outputs.repository }}
      release_pending: ${{ steps.release.outputs.release_pending }}
    steps:
      # Full history, but no blob over 256 KiB: the binary art is never downloaded.
      # Keep the exclusions equal to the binary patterns in .gitattributes;
      # tools/test_ci_changes.py checks that they match.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          filter: blob:limit=256k
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.png
            !*.jpg
            !*.gif
            !*.webp
            !*.blend
            !*.exr
            !assets/*/previews/recolor.html
      - name: Route the complete Git diff
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A push that creates the branch has no previous commit: compare with the empty tree.
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            BASE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          fi
          # blob:limit=256k omits blobs of 256 KiB or more, and they can't be fetched later
          # (no credentials), so every text file must stay strictly below 256 KiB.
          python3 - <<'PY'
          import os
          import subprocess

          listed = subprocess.check_output(['git', 'ls-files', '-z', '--', ':(exclude,attr:binary)'])
          large = [path for path in (os.fsdecode(name) for name in listed.split(b'\0') if name)
                   if os.path.lexists(path) and os.lstat(path).st_size >= 256 * 1024]
          for path in large:
              print(f'::error file={path}::{path} is text of 256 KiB or more. CI only downloads smaller blobs; '
                    'mark large generated or binary files as binary in .gitattributes.')
          raise SystemExit(1 if large else 0)
          PY
          # Binary files have no whitespace to check, and their contents aren't downloaded.
          git diff --check "$BASE" HEAD -- ':(exclude,attr:binary)'
          # An edited router must not decide whether its own checks run.
          git ls-tree "$BASE" -- tools/ci_changes.py > "$RUNNER_TEMP/ci-router-entry"
          if [ -s "$RUNNER_TEMP/ci-router-entry" ]; then
            git show "$BASE:tools/ci_changes.py" > "$RUNNER_TEMP/ci-router.py"
            python3 "$RUNNER_TEMP/ci-router.py" --base "$BASE" > "$RUNNER_TEMP/ci-routes"
          else
            # The initial installation has no base router: validate everything.
            : > "$RUNNER_TEMP/ci-routes"
          fi
          # Run any check the base router doesn't know about yet.
          for check in freighter freighter_art depots depots_art mod repository; do
            grep -qx "$check=\(true\|false\)" "$RUNNER_TEMP/ci-routes" || echo "$check=true" >> "$RUNNER_TEMP/ci-routes"
          done
          cat "$RUNNER_TEMP/ci-routes" >> "$GITHUB_OUTPUT"
      # Release Please's own commit raises the version records before changelog.txt has a section
      # for the new version (from pending notes, or "No player-facing changes." without them), so
      # the package check can only fail on it. The Release workflow finalizes changelog.txt
      # seconds later in a commit of its own, which gets the full CI run.
      - name: Hold the package check for the release notes
        id: release
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'release-please--branches--main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pending=true
          # Only the release metadata may differ from the base.
          changed="$(git diff --name-only --no-renames "$BASE" HEAD)"
          while IFS= read -r path; do
            case "$path" in
              info.json | changelog.txt | .github/version.txt | .github/release-please-manifest.json | docs/CHANGELOG.md) ;;
              *) pending=false ;;
            esac
          done <<< "$changed"
          # The version must be raised. Anything unreadable runs the package check, which reports it.
          read_version() { python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])'; }
          version="$(read_version < info.json)" || pending=false
          base_version="$(git show "$BASE:info.json" | read_version)" || pending=false
          [ "$version" != "$base_version" ] || pending=false
          # Finalized, changelog.txt starts with the new version's section (tools/release_metadata.py).
          separator="$(printf '%099d' 0 | tr 0 -)"
          [ "$(head -n 2 changelog.txt)" != "$separator"$'\n'"Version: $version" ] || pending=false
          if [ "$pending" = true ]; then
            echo '::notice::Skipping the installable package check: the Release workflow has yet to finalize changelog.txt for this version. Its finalizing commit gets the full CI run.'
          fi
          echo "release_pending=$pending" >> "$GITHUB_OUTPUT"

  freighter:
    name: Freighter
    needs: changes
    if: needs.changes.outputs.freighter == 'true'
    uses: ./.github/workflows/area.yml
    with:
      area: freighter
      art: ${{ needs.changes.outputs.freighter_art == 'true' }}

  depots:
    name: Depots
    needs: changes
    if: needs.changes.outputs.depots == 'true'
    uses: ./.github/workflows/area.yml
    with:
      area: depots
      art: ${{ needs.changes.outputs.depots_art == 'true' }}

  mod:
    name: Mod
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    uses: ./.github/workflows/area.yml
    with:
      area: mod

  repository:
    name: Repository
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    uses: ./.github/workflows/area.yml
    with:
      area: repository

  # The mod's script cost per tick against the pull request's base, without Factorio
  # (tools/emulate_ups.py; docs/benchmark.md). Reports in the job summary and only warns on a rise.
  ups:
    name: UPS benchmark
    needs: changes
    if: needs.changes.outputs.mod == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Comments the results on the pull request. Pull requests from forks get a read-only token
    # whatever this says, so for them the results stay in the job summary only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history but only the Lua and tools it runs; the base revision's files come from the
      # partial clone on demand (the repository is public).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            prototypes
            tests/lua
            tests/factorio/ups-benchmark_0.1.0
            tools
      - name: Install Lua 5.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y lua5.2
      - name: Check the emulator counts only the mod's own Lua
        run: python3 tools/test_emulate_ups.py
      - name: Compare the mod's cost per tick with the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 tools/emulate_ups.py --base "$BASE" --summary "$GITHUB_STEP_SUMMARY"
          --comment "$RUNNER_TEMP/ups-benchmark.md"
      # One comment per pull request, found by its marker and edited on later pushes.
      - name: Post the results on the pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BODY_PATH: ${{ runner.temp }}/ups-benchmark.md
        with:
          script: |
            const body = require('fs').readFileSync(process.env.BODY_PATH, 'utf8');
            const marker = '<!-- ups-benchmark -->';
            const { owner, repo } = context.repo;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: context.issue.number, per_page: 100,
              });
              const existing = comments.find(
                (comment) => comment.user?.type === 'Bot' && comment.body?.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
              }
            } catch (error) {
              core.warning(`Could not comment the UPS benchmark (a fork's pull request?): ${error.message}`);
            }

  package:
    name: Installable package
    needs: changes
    if: >-
      needs.changes.outputs.release_pending != 'true' && (
      needs.changes.outputs.mod == 'true' || needs.changes.outputs.repository == 'true' ||
      needs.changes.outputs.freighter_art == 'true' || needs.changes.outputs.depots_art == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the complete installable ZIP and verify its contents
        run: |
          python3 tools/test_releases.py
          python3 tools/package_mod.py
          python3 tools/validate_package.py

  # Stable name for a required status check: routed jobs are skipped or renamed
  # depending on the diff, so require this job instead of the individual checks.
  result:
    name: CI result
    needs: [changes, freighter, depots, mod, repository, ups, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A selected CI check finished with: $result"; exit 1 ;;
            esac
          done
