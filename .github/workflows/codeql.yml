name: CodeQL

# Advanced setup, so code scanning also runs CodeQL's maintainability and
# reliability queries (the security-and-quality suite). GitHub rejects these
# results while CodeQL default setup is on, so keep default setup off.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

concurrency:
  # Only first-run PR events supersede each other. Reruns of older commits are
  # isolated by run ID, as are pushes, merge groups and scheduled checks.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          # The retired 1x1 depots are frozen (AGENTS.md), so their tools are
          # never fixed; Ruff exempts them from Pyflakes for the same reason.
          config: |
            paths-ignore:
              - assets/depots/archive/1x1
      # Same categories as default setup, so its existing alerts carry over.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
