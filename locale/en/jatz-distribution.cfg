[mod-name]
jatz-distribution=Jat'z Distribution

[mod-description]
jatz-distribution=Automated freight trucks, depots and roads. In development: lay road between a provider depot's and a request depot's loading zones, and freighters deliver what the request depot asks for, driving only on road. Buffer, fuel and liquid depots don't take part yet.

[entity-name]
jatz-quinityn-freighter=Quinityn freighter
jatz-provider-depot=Provider depot
jatz-request-depot=Request depot
jatz-buffer-depot=Buffer depot
jatz-fuel-depot=Fuel depot
jatz-liquid-provider-depot=Liquid provider depot
jatz-liquid-request-depot=Liquid request depot
jatz-liquid-buffer-depot=Liquid buffer depot
jatz-freighter-drone=Quinityn freighter (delivering)

[entity-description]
jatz-quinityn-freighter=Armored eight-wheel freight truck.
jatz-provider-depot=Supplies the items in it to request and buffer depots. Freighters load at the marked loading zone, which must be on road. Its priority (1 to 10) decides which provider freighters go to first.
jatz-request-depot=Set an item and amount to keep in stock, and give it freighters: it sends as many as it needs, one after another, to fetch it from provider depots over the road. Mining it gives back its freighters.
jatz-buffer-depot=Keeps a stock of an item, fetched from provider depots with its own freighters. Request depots set to request from buffer depots can take from it; it sends nothing anywhere itself. Its priority (1 to 10) decides which buffer depot they take from first.
jatz-fuel-depot=Will refuel freighters with solid or liquid fuel. For now it only stores liquid fuel: refueling is not implemented yet.
jatz-liquid-provider-depot=Sends fluids out to freighters. (Dispatch is not implemented yet.)
jatz-liquid-request-depot=Receives fluids from freighters. (Dispatch is not implemented yet.)
jatz-liquid-buffer-depot=Stores fluids between deliveries. (Dispatch is not implemented yet.)
jatz-freighter-drone=On its way between depots. Freighters drive only on road.

[tile-name]
jatz-road=Road
jatz-depot-road=Depot road

[tile-description]
jatz-road=The only ground freighters drive on. Connect provider and request depots' loading zones with it.
jatz-depot-road=Laid by the depot under its loading zone sign, so road next to it connects. It goes when the depot does; mining it brings back the ground underneath.

[item-name]
jatz-road=Road

[jatz-gui]
request-title=Request
buffer-title=Buffer
provider-title=Provider
priority=Priority
priority-tooltip-provider=Freighters fetch from the provider depot with the highest priority they can reach by road, even when a lower one is nearer; nearest first among equal priorities. Buffer depots still come before every provider for request depots that request from them.
priority-tooltip-buffer=Request depots that request from buffer depots fetch from the one with the highest priority they can reach by road, even when a lower one is nearer; nearest first among equal priorities. Priority only orders buffer depots: any of them comes before every provider.
request-from-buffers=Request from buffer depots
request-from-buffers-tooltip=Also fetch this item from buffer depots, not only from provider depots. Buffer depots that can be reached by road always come first, even when a provider is nearer; providers supply only what no buffer can.
request-item-tooltip=The item to keep in stock. Freighters fetch it from provider depots.
request-count-tooltip=How many to keep in stock.
freighter-slot-tooltip=Freighters this depot sends out. Click with freighters in hand to put them in (right-click: one); click with an empty hand to take them (right-click: half); shift-click to move them to your inventory. Freighters put in the depot's chest move here too. Pipette picks one up.\nWith a freighter ghost in your cursor (as in remote view), click to have construction robots bring as many as fit (right-click: one more). In remote view, click with an empty cursor to cancel those requests, and right-click to have robots take the freighters away (right-click again to cancel).
freighters=Freighters: __1__ here, __2__ out, __3__ coming, __4__ leaving (holds __5__)
freighters-out=__1__ out
freighters-command-help=Shows how the freighter slot of the request depot you have open (or point at) stands: freighters in the slot, out, in the chest, requested and leaving, and what the requests are for.
freighters-command-none=Open or point at a request depot first.

[jatz-request-status]
none=Choose an item to request.
satisfied=Stocked.
full=Waiting: no room for more of this item in the depot.
no-road=Waiting: the loading zone is not on road.
no-provider=Waiting: no provider depot with road at its loading zone has this item.
unreachable=Waiting: no road route to a provider depot with this item. Trying again shortly.
no-freighter=Waiting: no freighter could be sent. Trying again shortly.
no-trucks=Waiting: no freighters. Put freighters in the freighter slot.
searching=Finding the provider nearest by road.
delivering=A freighter is on its way.

[controls]
jatz-pipette=Pipette (freighter slot)
