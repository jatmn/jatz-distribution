jatz-quinityn-freighter=Quinityn freighter
jatz-provider-depot=Provider depot
jatz-request-depot=Request depot
jatz-buffer-depot=Buffer depot
jatz-provider-depot-legacy=Provider depot
jatz-buffer-depot-legacy=Buffer depot
jatz-fuel-depot=Fuel depot
jatz-liquid-provider-depot=Liquid provider depot
jatz-liquid-request-depot=Liquid request depot
jatz-liquid-buffer-depot=Liquid buffer depot
jatz-freighter-drone=Quinityn freighter (delivering)
jatz-fuel-depot-tank=Fuel depot tank
jatz-road-monitor=Road network monitor
jatz-depot-settings=Depot request settings
jatz-road-tunnel=Road tunnel

[entity-description]
jatz-quinityn-freighter=Armored eight-wheel freight truck.
jatz-provider-depot=Supplies the items in it to request and buffer depots. Freighters load at the marked loading zone, which must be on road. Its priority (1 to 10) decides which provider freighters go to first. Tick "Logistic robots can use it" in its window to let robots take from it too, as from a passive provider chest.
jatz-request-depot=Set an item and amount to keep in stock, and give it freighters: it sends as many as it needs, one after another, to fetch it from provider depots over the road, and from buffer depots when no provider can supply it. Mining it gives back its freighters.
jatz-buffer-depot=Keeps a stock of an item, fetched from provider depots with its own freighters. Request depots take from it first if set to request from buffer depots, and otherwise only what no provider can supply; it sends nothing anywhere itself. Its priority (1 to 10) decides which buffer depot they take from first. Tick "Logistic robots can use it" in its window to make it a buffer chest for robots too.
jatz-fuel-depot=Freighters fill up here by themselves, at the marked loading zone, which must be on road. Put in any fuel item, or pipe in any fluid that burns: they take the fluid first, then items. Its window shows the liquid fuel.
jatz-liquid-provider-depot=Supplies the fluid in its tank to liquid request and liquid buffer depots. Freighters load at the marked loading zone, which must be on road, and carry 750 at a time (more with freighter fluid capacity research). Its priority (1 to 10) decides which liquid provider freighters go to first. Item depots never take from it.
jatz-liquid-request-depot=Set a fluid and amount to keep in its tank, and give it freighters: it sends as many as it needs, one after another, to fetch it from liquid provider depots over the road, and from liquid buffer depots when no provider can supply it, 750 at a time (more with freighter fluid capacity research). Mining it gives back its freighters.
jatz-liquid-buffer-depot=Keeps a stock of a fluid, fetched from liquid provider depots with its own freighters. Liquid request depots take from it first if set to request from buffer depots, and otherwise only what no liquid provider can supply; it sends nothing anywhere itself. Its priority (1 to 10) decides which liquid buffer depot they take from first.
jatz-freighter-drone=On its way between depots. Freighters drive only on road, and burn fuel as they go: when the tank is too low for where they are going, they fill up at the nearest fuel depot by road first. One that runs dry crawls.
jatz-fuel-depot-tank=Holds a fuel depot's liquid fuel.
jatz-road-tunnel=Freighters go under whatever stands between two road tunnels facing each other, as items go under buildings on underground belts. Build one at the end of a road, its mouth to the road: the tile in front of it is where freighters drive in and come out. Freighters use tunnels only to reach depots on another road network.
jatz-depot-settings=A request or buffer depot's request and freighters in a blueprint, so blueprint parametrisation can change them. It never stays in the world: the depot built from the blueprint takes them.
jatz-road-monitor=Build it beside road, like a depot's loading zone, and wire it: once a second it sends to the circuit network one reading of the depots on that road network, like a roboport reading its logistic network. Open it to choose: what provider and buffer depots hold, what provider depots hold, what request depots hold, or what request depots still need. Depots switched off by their circuit condition aren't counted.

