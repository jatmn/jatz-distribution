[mod-name]
jatz-distribution=Jat'z Distribution

[mod-description]
jatz-distribution=Armored freight trucks that keep your factory supplied by road. Build provider and request depots, lay road between them, and freighters fetch items and fluids from the nearest source by road, refueling themselves at fuel depots. Inspired by Transport Drones, with buffers, priorities, circuit control and blueprints.

