[mod-setting-description]
jatz-provider-depot-slots=How many slots a [item=jatz-provider-depot] provider depot's chest has.\n\n[color=green]Minimum:[/color] 1\n[color=green]Maximum:[/color] 1,000\n\n[color=yellow](Default: 48, like a [item=steel-chest] steel chest)[/color]\n\n[color=red]Making it smaller on an existing save can lose the items in the slots taken away.[/color]
jatz-request-depot-slots=How many slots a [item=jatz-request-depot] request depot's chest has.\n\n[color=green]Minimum:[/color] 1\n[color=green]Maximum:[/color] 1,000\n\n[color=yellow](Default: 48, like a [item=steel-chest] steel chest)[/color]\n\n[color=red]Making it smaller on an existing save can lose the items in the slots taken away.[/color]
jatz-buffer-depot-slots=How many slots a [item=jatz-buffer-depot] buffer depot's chest has.\n\n[color=green]Minimum:[/color] 1\n[color=green]Maximum:[/color] 1,000\n\n[color=yellow](Default: 48, like a [item=steel-chest] steel chest)[/color]\n\n[color=red]Making it smaller on an existing save can lose the items in the slots taken away.[/color]
jatz-liquid-provider-depot-capacity=How much fluid a [item=jatz-liquid-provider-depot] liquid provider depot's tank holds.\n\n[color=green]Minimum:[/color] 1,000\n[color=green]Maximum:[/color] 1,000,000\n\n[color=yellow](Default: 25,000, like a [item=storage-tank] storage tank)[/color]\n\n[color=red]Making it smaller on an existing save can lose the fluid above the new size.[/color]
jatz-liquid-buffer-depot-capacity=How much fluid a [item=jatz-liquid-buffer-depot] liquid buffer depot's tank holds.\n\n[color=green]Minimum:[/color] 1,000\n[color=green]Maximum:[/color] 1,000,000\n\n[color=yellow](Default: 25,000, like a [item=storage-tank] storage tank)[/color]\n\n[color=red]Making it smaller on an existing save can lose the fluid above the new size.[/color]
jatz-fuel-depot-slots=How many slots a [item=jatz-fuel-depot] fuel depot's chest has.\n\n[color=green]Minimum:[/color] 1\n[color=green]Maximum:[/color] 1,000\n\n[color=yellow](Default: 48, like a [item=steel-chest] steel chest)[/color]\n\n[color=red]Making it smaller on an existing save can lose the items in the slots taken away.[/color]
jatz-fuel-depot-capacity=How much liquid fuel a [item=jatz-fuel-depot] fuel depot's tank holds.\n\n[color=green]Minimum:[/color] 1,000\n[color=green]Maximum:[/color] 1,000,000\n\n[color=yellow](Default: 25,000, like a [item=storage-tank] storage tank)[/color]\n\n[color=red]Making it smaller on an existing save can lose the fluid above the new size.[/color]
jatz-freighter-drivable=Lets players place [item=jatz-quinityn-freighter] freighters and drive them like a car.\n\n[color=green]Enabled:[/color] freighters can be placed and driven.\n[color=green]Disabled:[/color] freighters only go out from [item=jatz-request-depot] request depots to make deliveries. Ones already placed can still be driven and picked up.\n\n[color=yellow](Default: Disabled)[/color]
jatz-freighter-fuel-capacity=How much fuel a [item=jatz-quinityn-freighter] freighter's tank holds, in MJ.\nNew freighters come with a full tank, and fill up at [item=jatz-fuel-depot] fuel depots by themselves.\n\n[color=green]Minimum:[/color] 0.1 MJ\n[color=green]Maximum:[/color] 100,000 MJ\n\n[color=yellow](Default: 20 MJ, as much as 5 [item=coal] coal)[/color]
jatz-freighter-fuel-per-tile=How much fuel a [item=jatz-quinityn-freighter] freighter burns for each tile it drives, in kJ.\n\n[color=green]Minimum:[/color] 0 kJ, which turns fuel off\n[color=green]Maximum:[/color] 100,000 kJ\n\n[color=yellow](Default: 10 kJ, so a full 20 MJ tank lasts 2,000 tiles)[/color]
