[mod-name]
jatz-distribution=Jat'z Distribution

[mod-description]
jatz-distribution=Automated freight trucks, depots and roads. In development: lay road between a provider depot's and a request depot's loading zones, and freighters deliver what the request depot asks for, driving only on road. Liquid depots do the same for fluids. The fuel depot doesn't take part yet.

[entity-name]
jatz-quinityn-freighter=Quinityn freighter
jatz-provider-depot=Provider depot
jatz-request-depot=Request depot
jatz-buffer-depot=Buffer depot
jatz-fuel-depot=Fuel depot
jatz-liquid-provider-depot=Liquid provider depot
jatz-liquid-request-depot=Liquid request depot
jatz-liquid-buffer-depot=Liquid buffer depot
jatz-freighter-drone=Quinityn freighter (delivering)

[entity-description]
jatz-quinityn-freighter=Armored eight-wheel freight truck.
jatz-provider-depot=Supplies the items in it to request and buffer depots. Freighters load at the marked loading zone, which must be on road. Its priority (1 to 10) decides which provider freighters go to first.
jatz-request-depot=Set an item and amount to keep in stock, and give it freighters: it sends as many as it needs, one after another, to fetch it from provider depots over the road, and from buffer depots when no provider can supply it. Mining it gives back its freighters.
jatz-buffer-depot=Keeps a stock of an item, fetched from provider depots with its own freighters. Request depots take from it first if set to request from buffer depots, and otherwise only what no provider can supply; it sends nothing anywhere itself. Its priority (1 to 10) decides which buffer depot they take from first.
jatz-fuel-depot=Will refuel freighters with solid or liquid fuel. For now it only stores liquid fuel: refueling is not implemented yet.
jatz-liquid-provider-depot=Supplies the fluid in its tank to liquid request and liquid buffer depots. Freighters load at the marked loading zone, which must be on road, and carry 500 at a time. Its priority (1 to 10) decides which liquid provider freighters go to first. Item depots never take from it.
jatz-liquid-request-depot=Set a fluid and amount to keep in its tank, and give it freighters: it sends as many as it needs, one after another, to fetch it from liquid provider depots over the road, and from liquid buffer depots when no provider can supply it, 500 at a time. Mining it gives back its freighters.
jatz-liquid-buffer-depot=Keeps a stock of a fluid, fetched from liquid provider depots with its own freighters. Liquid request depots take from it first if set to request from buffer depots, and otherwise only what no liquid provider can supply; it sends nothing anywhere itself. Its priority (1 to 10) decides which liquid buffer depot they take from first.
jatz-freighter-drone=On its way between depots. Freighters drive only on road.

[tile-name]
jatz-road=Road
jatz-depot-road=Depot road

[tile-description]
jatz-road=The only ground freighters drive on. Connect provider and request depots' loading zones with it.
jatz-depot-road=Laid by the depot under its loading zone sign, so road next to it connects. It goes when the depot does; mining it brings back the ground underneath.

[item-name]
jatz-road=Road

[jatz-gui]
request-title=Request
buffer-title=Buffer
provider-title=Provider
liquid-request-title=Liquid request
liquid-buffer-title=Liquid buffer
liquid-provider-title=Liquid provider
priority=Priority
priority-tooltip-provider=Freighters fetch from the provider depot with the highest priority they can reach by road, even when a lower one is nearer; nearest first among equal priorities. Buffer depots still come before every provider for request depots that request from them, and after every provider for the rest.
priority-tooltip-buffer=Request depots fetch from the buffer depot with the highest priority they can reach by road, even when a lower one is nearer; nearest first among equal priorities. Priority only orders buffer depots: any of them comes before every provider for request depots that request from buffer depots, and after every provider for the rest.
request-from-buffers=Request from buffer depots
request-from-buffers-tooltip=Fetch it from buffer depots first. Ticked, buffer depots that can be reached by road always come first, even when a provider is nearer; providers supply only what no buffer can. Unticked, provider depots come first, and buffer depots supply only what no provider can.
request-item-tooltip=The item to keep in stock. Freighters fetch it from provider depots, and for a request depot from buffer depots too.
request-count-tooltip=How many to keep in stock.
request-fluid-tooltip=The fluid to keep in the tank. Freighters fetch it from liquid provider depots, and for a liquid request depot from liquid buffer depots too, 500 at a time.
request-amount-tooltip=How much to keep in the tank.
freighter-slot-tooltip=Freighters this depot sends out. Click with freighters in hand to put them in (right-click: one); click with an empty hand to take them (right-click: half); shift-click to move them to your inventory. Freighters put in the depot's chest move here too. Pipette picks one up.\nWith a freighter ghost in your cursor (as in remote view), click to have construction robots bring as many as fit (right-click: one more). In remote view, click with an empty cursor to cancel those requests, and right-click to have robots take the freighters away (right-click again to cancel).
freighters=Freighters: __1__ here, __2__ out, __3__ coming, __4__ leaving (holds __5__)
freighters-out=__1__ out
freighters-command-help=Shows how the freighter slot of the request depot you have open (or point at) stands: freighters in the slot, out, in the chest, requested and leaving, and what the requests are for.
freighters-command-none=Open or point at a request depot first.

[jatz-request-status]
none=Choose what to request.
satisfied=Stocked.
full=Waiting: no room for more in the depot.
no-road=Waiting: the loading zone is not on road.
no-provider=Waiting: no provider depot with road at its loading zone has any (nor, for a request depot, any buffer depot).
unreachable=Waiting: no road route to a provider depot that has some (nor, for a request depot, to a buffer depot). Trying again shortly.
no-freighter=Waiting: no freighter could be sent. Trying again shortly.
no-trucks=Waiting: no freighters. Put freighters in the freighter slot.
searching=Finding a provider depot by road (or, for a request depot, a buffer depot).
delivering=A freighter is on its way.
other-fluid=Waiting: the tank holds another fluid. Empty it first.

[controls]
jatz-pipette=Pipette (freighter slot)

[mod-setting-name]
jatz-liquid-provider-depot-capacity=[item=jatz-liquid-provider-depot] Liquid provider depot tank size
jatz-liquid-buffer-depot-capacity=[item=jatz-liquid-buffer-depot] Liquid buffer depot tank size
jatz-freighter-drivable=[item=jatz-quinityn-freighter] Place freighters as cars

[mod-setting-description]
jatz-liquid-provider-depot-capacity=How much fluid a liquid provider depot's tank holds (25,000 by default, like a storage tank). Making it smaller on an existing save can lose the fluid above the new size.
jatz-liquid-buffer-depot-capacity=How much fluid a liquid buffer depot's tank holds (25,000 by default, like a storage tank). Making it smaller on an existing save can lose the fluid above the new size.
jatz-freighter-drivable=Lets players place freighters and drive them like a car. Off: freighters only go out from request depots to make deliveries, and ones already placed can still be driven and picked up.
