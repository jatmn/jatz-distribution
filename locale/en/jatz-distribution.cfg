[technology-description]
jatz-freight-system=Depots, Quinityn freighters and road: freighters deliver items between depots, driving only on road.
jatz-liquid-freight=Expands the freight system with liquid depots, so freighters deliver fluids too.
jatz-road-network-monitor=A combinator that reads what the depots on its road network hold, or still need, onto the circuit network.
jatz-road-tunnels=Tunnels that join road networks under the factory: freighters drive in at one end and come out at the other.
jatz-freighter-speed=Delivering freighters drive faster.
jatz-freighter-item-capacity=Delivering freighters carry more items.
jatz-freighter-fluid-capacity=Delivering freighters carry more fluid.

[modifier-description]
jatz-freighter-speed=Freighter speed: +__1__%
jatz-freighter-item-capacity=Freighter item capacity: +__1__ stack
jatz-freighter-fluid-capacity=Freighter fluid capacity: +__1__

[jatz-gui]
inventory=Inventory
inventory-tooltip=Your inventory. On a liquid request or buffer depot, click a freighter to pick it up, then click the slot. Shift-click puts that stack in the slot; ctrl-click puts in every freighter you are carrying. A liquid provider has no freighter slot.
request-title=Request
buffer-title=Buffer
provider-title=Provider
liquid-request-title=Liquid request
liquid-buffer-title=Liquid buffer
liquid-provider-title=Liquid provider
priority=Priority
priority-tooltip-provider=Freighters fetch from the provider depot with the highest priority they can reach by road, even when a lower one is nearer; nearest first among equal priorities. Buffer depots still come before every provider for request depots that request from them, and after every provider for the rest.
priority-tooltip-buffer=Request depots fetch from the buffer depot with the highest priority they can reach by road, even when a lower one is nearer; nearest first among equal priorities. Priority only orders buffer depots: any of them comes before every provider for request depots that request from buffer depots, and after every provider for the rest.
robot-access=Logistic robots can use it
robot-access-tooltip-provider=Ticked, the depot is part of the logistic network as a passive provider chest: logistic and construction robots take items from it. Freighters still fetch from it as before; they skip what robots have taken.
robot-access-circuit-tooltip=Set by the enable/disable condition in the depot's circuit network settings (the game's, for logistic chests), which decides whether robots can use it while it is on. Turn that off to set it here.
robot-access-tooltip-buffer=Ticked, the depot is part of the logistic network as a buffer chest: robots take items from it for requester chests and construction, and fill the logistic requests set in its window. Its freighters keep its own request stocked as before.
request-from-buffers=Request from buffer depots
request-full-loads=Full loads only
request-full-loads-tooltip=Send a freighter only when it can come back full: when a depot it fetches from has a whole freighter load to give, and this depot has room for one. Smaller amounts wait until there is a full load. A request smaller than one load is fetched whole, once the depot has room for all of it.
request-full-loads-fluid-tooltip=Send a freighter only when it can come back full: when a depot it fetches from has a whole freighter load to give (750, more with freighter fluid capacity research), and this tank has room for one. Smaller amounts wait until there is a full load. A request smaller than one load is fetched whole, once the tank has room for all of it.
request-from-buffers-tooltip=Fetch it from buffer depots first. Ticked, buffer depots that can be reached by road always come first, even when a provider is nearer; providers supply only what no buffer can. Unticked, provider depots come first, and buffer depots supply only what no provider can.
request-item-tooltip=The item to keep in stock. Freighters fetch it from provider depots, and for a request depot from buffer depots too.
request-count-tooltip=How many to keep in stock.
request-fluid-tooltip=The fluid to keep in the tank. Freighters fetch it from liquid provider depots, and for a liquid request depot from liquid buffer depots too, 750 at a time.
request-amount-tooltip=How much to keep in the tank.
freighter-slot-tooltip=Freighters this depot sends out. Click with freighters in hand to put them in (right-click: one); click with an empty hand to take them (right-click: half); shift-click to move them to your inventory. Freighters put in the depot's chest move here too. Pipette picks one up.\nWith a freighter ghost in your cursor (as in remote view), click to have construction robots bring as many as fit (right-click: one more). In remote view, click with an empty cursor to cancel those requests, and right-click to have robots take the freighters away (right-click again to cancel).
freighters=Freighters: __1__ here, __2__ out, __3__ coming, __4__ leaving (holds __5__)
freighters-out=__1__ out
freighters-command-help=Shows how the freighter slot of the request depot you have open (or point at) stands: freighters in the slot, out, in the chest, requested and leaving, and what the requests are for.
freighters-command-none=Open or point at a request depot first.
fuel-title=Fuel
fuel-liquid=Liquid fuel:
fuel-amount=__1__ / __2__
fuel-not-burnable=(doesn't burn: flush it)
fuel-tooltip=Fluid piped into the depot. Freighters fill up with it if it burns, before any fuel items in the depot.
fuel-flush=Flush: empty the tank, and the pipes joined to it, of the fluid it holds.
energy-mj=__1__ MJ
energy-gj=__1__ GJ
freighter-fuel=Fuel: __1__ (a full tank holds __2__)
freighter-fuel-home=Fuel: __1__ of __2__ here full, lowest __3__
freighter-fuel-none=Fuel: no freighters here
freighter-fuel-tooltip=Fuel of the freighters here: __1__\nOut: __2__\nA full tank holds __3__. A fuel item worth more goes in whole, and lasts until used up. Freighters fill up at fuel depots.
circuit-enabled=Enable/disable
circuit-enabled-tooltip=Switch the depot on and off with a condition, like a logistic chest. Ticked, the depot takes part in deliveries only while the condition below holds, read from the circuit network or from the depot's own contents: switched off, it sends no freighters and none come to fetch from it. Freighters already on their way finish their trips.
monitor-reading=Signals: the depots on this road network
monitor-reading-supply=What provider and buffer depots hold
monitor-reading-supply-tooltip=What freighters can fetch: the items (each quality its own signal) and fluids that provider and buffer depots hold.
monitor-reading-providers=What provider depots hold
monitor-reading-providers-tooltip=The items (each quality its own signal) and fluids that provider depots hold. Buffer depots aren't counted.
monitor-reading-requests=What request depots hold
monitor-reading-requests-tooltip=The items (each quality its own signal) and fluids that request depots hold, item and liquid. Buffer depots aren't counted.
monitor-reading-needs=What request depots still need
monitor-reading-needs-tooltip=Each request depot's request, less what it holds and what freighters are bringing it. Buffer depots aren't counted.
circuit-mode-network=Circuit network
circuit-mode-network-tooltip=Read the red and green wires, leaving out this depot's own contents: what it sends on them itself and what road network monitors count for it. "Wood > 3000" switches it on only when 3000 wood are elsewhere. Without a wire the condition does nothing.
circuit-mode-contents=This depot's contents
circuit-mode-contents-tooltip=Read what this depot holds: its items, each quality its own signal, and its fluid in whole units. No wire needed.
circuit-first-tooltip=The signal to compare. Everything: every signal must match (also true with no signals). Anything: at least one must.
circuit-comparator-tooltip=How to compare.
circuit-second-tooltip=The signal to compare it with. Leave it empty to compare with the number beside it.
circuit-constant-tooltip=The number to compare it with, when no signal is chosen beside it.

[jatz-circuit-status]
off=No circuit condition: always on.
not-connected=No red or green wire: always on.
enabled=On: the circuit condition holds.
disabled=Off: the circuit condition doesn't hold. No freighters are sent from or to this depot.
entity-off=Switched off by its circuit condition

[jatz-request-status]
none=Choose what to request.
satisfied=Stocked.
full=Waiting: no room for more in the depot.
no-road=Waiting: the loading zone is not on road.
no-provider=Waiting: no provider depot with road at its loading zone has any (nor, for a request depot, any buffer depot).
unreachable=Waiting: no road route to a provider depot that has some (nor, for a request depot, to a buffer depot). Trying again shortly.
no-freighter=Waiting: no freighter could be sent. Trying again shortly.
no-trucks=Waiting: no freighters. Put freighters in the freighter slot.
searching=Finding a provider depot by road (or, for a request depot, a buffer depot).
delivering=A freighter is on its way.
other-fluid=Waiting: the tank holds another fluid. Empty it first.
no-fuel=Waiting for fuel: the freighters' tanks are too low to reach the provider depot, and the fuel depots have no fuel. They set off as soon as a fuel depot connected by road has some. Freighters only fill up at fuel depots: fuel in other depots is cargo.
no-fuel-depot=No fuel depot connected by road: the freighters' tanks are too low to reach the provider depot. Build a fuel depot, connect it by road and put fuel in it, and they go there to fill up first.
disabled=Off: switched off by its circuit condition.
full-load=Waiting for a full load: set to full loads only, and there is no room for one here, or no depot it fetches from has one to give.
least-fluid=Waiting for at least 100: freighters never fetch less of a fluid (a request below 100 is fetched whole), and there is no room for that here, or no depot it fetches from has that much to give.

