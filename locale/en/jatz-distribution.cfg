[entity-description]
jatz-quinityn-freighter=Armored eight-wheel freight truck.
jatz-provider-depot=Sends dry cargo out to freighters. (Dispatch is not implemented yet.)
jatz-request-depot=Receives dry cargo from freighters. (Dispatch is not implemented yet.)
jatz-buffer-depot=Holds cargo in transit. (Dispatch is not implemented yet.)
jatz-fuel-depot=Refuels freighters. Currently stores liquid fuel only; solid fuel service is not implemented yet.
