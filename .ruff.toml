# Python lint for repository tooling: correctness rules only, shared by every
# Yuoki mod repository. E9 reports syntax errors; F (Pyflakes) reports undefined
# names and unused imports/variables. Formatting and style are not enforced.
target-version = "py312"

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# The retired 1x1 depot tools are frozen (see AGENTS.md); syntax is still checked.
"assets/depots/archive/**" = ["F"]
